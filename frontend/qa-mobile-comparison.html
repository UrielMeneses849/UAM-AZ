<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mobile Visual QA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 780px; height: 870px; overflow: hidden; background: #d9d9d9; font-family: Arial, sans-serif; }
      .labels { height: 26px; display: grid; grid-template-columns: 390px 390px; color: #fff; background: #222; font-size: 11px; line-height: 26px; text-align: center; }
      .comparison { display: grid; grid-template-columns: 390px 390px; }
      iframe { width: 390px; height: 844px; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <div class="labels"><span>REFERENCE · 390 × 844</span><span>IMPLEMENTATION · 390 × 844</span></div>
    <div class="comparison">
      <iframe src="https://ayamictlan.uam.mx:8443/sae/azc/aewbf001.omuestraframes?mod=1"></iframe>
      <iframe src="/login"></iframe>
    </div>
  </body>
</html>
